services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.lein
    working_dir: /builder
    volumes:
      - jar-volume:/builder/target
      - .:/builder
    command: >
        sh -c "set -x &&
              rm -f /builder/target/metabase-flightsql-driver-0.1.0-SNAPSHOT-standalone.jar &&
              lein uberjar"
    restart: "no"

  metabase:
    image: metabase/metabase:v0.62.5
    container_name: metabase
    hostname: metabase
    depends_on:
      - postgres
      - spiced
      - gizmosql
      - builder
    volumes:
      - jar-volume:/builder/target
      - /dev/urandom:/dev/random:ro
    command: >
      sh -c "while [ ! -f /builder/target/metabase-flightsql-driver-0.1.0-SNAPSHOT-standalone.jar ]; do
              echo 'Waiting for jar file...';
              sleep 5;
            done &&
            sleep 10 &&
            cp /builder/target/metabase-flightsql-driver-0.1.0-SNAPSHOT-standalone.jar /plugins/flightsql-metabase-driver.jar &&
            echo 'Plugin copied, starting Metabase' &&
            exec /app/run_metabase.sh"
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: mysecretpassword
      MB_DB_HOST: postgres
    networks:
      - metanet1
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.4
    container_name: postgres
    hostname: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: mysecretpassword
    networks:
      - metanet1

  spiced:
    # 2.x: models are bundled in the default image (bigger pull), spicepod
    # version v2 is the default, and runtime.results_cache was renamed to
    # runtime.caching.sql_results.
    image: spiceai/spiceai:2.1.1
    container_name: spiced-container
    privileged: true
    # Note: removed 'user: root' as spiceai 1.10.2+ doesn't have root in passwd file
    # this tmpfs prevents an error when the setup script of the dockerfile tries to create this folder after an initial run
    tmpfs:
      - /spice_sandbox
    volumes:
      - type: bind
        source: ./spice/spicepod.yaml
        target: /app/spicepod.yaml
      - type: bind
        source: ./data
        target: /app/data
    command: "--http 0.0.0.0:8090 --metrics 0.0.0.0:9090 --flight 0.0.0.0:50051"
    ports:
      - "50051:50051"
      - "8090:8090"
      - "9090:9090"
    networks:
      - metanet1

  # Same Spice image without api-key auth: positive test target for the
  # driver's anonymous (no credentials) connection path.
  spiced-anon:
    image: spiceai/spiceai:2.1.1
    container_name: spiced-anon
    hostname: spiced-anon
    privileged: true
    tmpfs:
      - /spice_sandbox
    volumes:
      - type: bind
        source: ./spice/spicepod-anon.yaml
        target: /app/spicepod.yaml
      - type: bind
        source: ./data
        target: /app/data
    command: "--http 0.0.0.0:8090 --metrics 0.0.0.0:9090 --flight 0.0.0.0:50051"
    ports:
      - "50052:50051"
    networks:
      - metanet1

  # InfluxDB 3 Core: bearer-token-only Flight SQL on port 8181 (HTTP + gRPC
  # share the port). Database selection travels as a `database` gRPC header,
  # which the driver passes through via additional-options. Read-only from
  # Metabase's perspective (writes use line protocol over HTTP).
  # Seed with: python scripts/setup_influxdb3.py  (creates admin token ->
  # .env INFLUXDB3_TOKEN, writes sample data into the `demo` database).
  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3
    hostname: influxdb3
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
    ports:
      - "8181:8181"
    networks:
      - metanet1

  gizmosql:
    # Pinned (releases are near-weekly); a -slim and an LTS channel
    # (gizmodata/gizmosql-lts) also exist.
    image: gizmodata/gizmosql:v1.35.1
    container_name: gizmosql
    hostname: gizmosql
    volumes:
      - type: bind
        source: ./gizmosql/init.sql
        target: /opt/gizmosql/init.sql
    environment:
      TLS_ENABLED: "false"
      GIZMOSQL_USERNAME: "gizmosql"
      GIZMOSQL_PASSWORD: "gizmosql_password"
      # Signs the session JWTs the server issues after basic auth. Without a
      # stable value, every container restart invalidates the bearer tokens
      # Metabase's pooled connections retained (retainAuth) -> auth errors
      # until the pool cycles. Demo value; use a real secret in production.
      SECRET_KEY: "flightsql-demo-jwt-signing-key-0123456789abcdef"
      PRINT_QUERIES: "1"
      DATABASE_FILENAME: ":memory:"
      INIT_SQL_COMMANDS_FILE: "/opt/gizmosql/init.sql"
    ports:
      - "31337:31337"
    networks:
      - metanet1

networks:
  metanet1:
    driver: bridge

volumes:
  pgdata:
  jar-volume:
  influxdb3-data:
