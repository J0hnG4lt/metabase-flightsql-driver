name: Build Metabase arrow-flight-sql Driver

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# The Metabase version the released jar is BUILT against. One jar per release
# (the community norm — see README "Compatibility"). Bump this when you target a
# newer Metabase line; the compat-smoke job proves which versions it loads on.
env:
  MB_BUILD_REF: v0.63.1.6

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Clojure + clj-kondo
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: 1.12.0.1479
        clj-kondo: 2026.04.15
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint driver source
      run: clj-kondo --lint src

  # Build ONE jar, against MB_BUILD_REF. Same artifact users download and CI
  # smoke-tests across Metabase versions below.
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v4
      with:
        repository: metabase/metabase
        ref: ${{ env.MB_BUILD_REF }}
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v4
      with:
        path: metabase/modules/drivers/arrow-flight-sql

    - name: Register arrow-flight-sql as the only driver module
      working-directory: ./metabase
      # Single-entry map (the ClickHouse-driver pattern): building one driver
      # doesn't need the in-tree driver modules, and upstream reshuffles of
      # modules/drivers can't break us.
      run: |
        echo '{:deps {metabase/arrow-flight-sql {:local/root "arrow-flight-sql"}}}' > modules/drivers/deps.edn
        cat modules/drivers/deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Yarn 1.x
      run: |
        npm install -g yarn@1
        yarn --version

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: 1.12.0.1479
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-driver-${{ env.MB_BUILD_REF }}-${{ hashFiles('metabase/modules/drivers/arrow-flight-sql/deps.edn', 'metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-driver-${{ env.MB_BUILD_REF }}-

    - name: Build driver
      working-directory: ./metabase
      run: |
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh arrow-flight-sql

    - name: Collect the jar
      run: |
        mkdir -p out
        cp metabase/resources/modules/arrow-flight-sql.metabase-driver.jar out/
        ls -la out/

    - name: Upload driver artifact
      uses: actions/upload-artifact@v4
      with:
        name: metabase-arrow-flight-sql-driver
        path: out/arrow-flight-sql.metabase-driver.jar
        if-no-files-found: error

  # Prove the single jar actually LOADS and works on each Metabase version we
  # claim: drop it into the official image, boot, register a GizmoSQL
  # connection, sync, and query. This is what makes the README compatibility
  # table evidence rather than a guess.
  compat-smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built against this line → must pass.
          - metabase: v0.63.1.6
            jdk_unsafe: "--sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED"
            required: true
          # Older line, informational (0.62 EOLs 2026-09-01; JDK 21 → no Unsafe flag).
          - metabase: v0.62.5
            jdk_unsafe: ""
            required: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install requests

    - name: Download the driver jar
      uses: actions/download-artifact@v4
      with:
        name: metabase-arrow-flight-sql-driver
        path: ./jar

    - name: Boot Metabase ${{ matrix.metabase }} with the driver + a GizmoSQL backend
      run: |
        set -euo pipefail
        docker network create mbnet
        docker run -d --name gizmosql --network mbnet \
          -e TLS_ENABLED=0 -e GIZMOSQL_USERNAME=gizmosql -e GIZMOSQL_PASSWORD=gizmosql_password \
          -e SECRET_KEY=ci-smoke-key-0123456789abcdef -e DATABASE_FILENAME=:memory: \
          -e INIT_SQL_COMMANDS_FILE=/opt/gizmosql/init.sql \
          -v "$PWD/gizmosql/init.sql:/opt/gizmosql/init.sql:ro" \
          gizmodata/gizmosql:v1.35.1
        docker run -d --name metabase --network mbnet -p 3000:3000 \
          -e JAVA_OPTS="--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true ${{ matrix.jdk_unsafe }}" \
          -v "$PWD/jar/arrow-flight-sql.metabase-driver.jar:/plugins/arrow-flight-sql.metabase-driver.jar:ro" \
          metabase/metabase:${{ matrix.metabase }}

    - name: Wait for Metabase health
      run: |
        for i in $(seq 1 60); do
          curl -sf http://localhost:3000/api/health >/dev/null && { echo healthy; exit 0; }
          sleep 5
        done
        docker logs metabase 2>&1 | tail -60; exit 1

    - name: Smoke-test — driver loads, connects, queries
      run: |
        python scripts/ci_bootstrap.py
        python scripts/compat_smoke.py

    - name: Logs on failure
      if: failure()
      run: |
        docker logs metabase 2>&1 | tail -100 || true
        docker logs gizmosql 2>&1 | tail -40 || true

  # Metabase's own driver test harness (test extensions under test/) against a
  # GizmoSQL service — DDL + INSERT over Flight SQL, validated sync, MBQL
  # known-answer queries — plus the pure unit tests for the spec builder.
  driver-test-suite:
    runs-on: ubuntu-latest
    services:
      gizmosql:
        image: gizmodata/gizmosql:v1.35.1
        env:
          TLS_ENABLED: "0"
          GIZMOSQL_USERNAME: gizmosql
          GIZMOSQL_PASSWORD: gizmosql_password
          SECRET_KEY: ci-test-jwt-signing-key-0123456789abcdef
          PRINT_QUERIES: "0"
        ports:
          - 31337:31337

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v4
      with:
        repository: metabase/metabase
        ref: v0.63.1
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v4
      with:
        path: metabase/modules/drivers/arrow-flight-sql

    - name: Register driver module and test path
      working-directory: ./metabase
      run: |
        echo '{:deps {metabase/arrow-flight-sql {:local/root "arrow-flight-sql"}}}' > modules/drivers/deps.edn
        # insert our test dir into the :drivers-dev :extra-paths vector
        sed -i 's|"modules/drivers/athena/test"|"modules/drivers/arrow-flight-sql/test"\n    "modules/drivers/athena/test"|' deps.edn
        grep -n "arrow-flight-sql/test" deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: 1.12.0.1479
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-driver-tests-v0.63.1-${{ hashFiles('metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-driver-tests-v0.63.1-

    - name: Run driver test namespace via the shared harness
      working-directory: ./metabase
      env:
        DRIVERS: arrow-flight-sql
        MB_ARROW_FLIGHT_SQL_TEST_HOST: localhost
        MB_ARROW_FLIGHT_SQL_TEST_PORT: "31337"
        MB_ARROW_FLIGHT_SQL_TEST_USER: gizmosql
        MB_ARROW_FLIGHT_SQL_TEST_PASSWORD: gizmosql_password
      run: |
        clojure -X:dev:drivers:drivers-dev:test :only '[metabase.driver.arrow-flight-sql-test]'

  # NOTE: release asset attachment lives in release-please.yml, not here.
  # A `release: published` trigger would never fire, because GitHub does not
  # start workflows from events raised by the default GITHUB_TOKEN that
  # release-please uses to create the release.
