name: Build Metabase arrow-flight-sql Driver

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Clojure + clj-kondo
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: latest
        github-token: ${{ secrets.GITHUB_TOKEN }}
        clj-kondo: latest
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint driver source
      run: clj-kondo --lint src

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One build per supported Metabase release line. Keep in sync with the
        # compatibility table in README.md. 62.x EOLs 2026-09-01.
        metabase-ref: [ v0.62.5, v0.63.1 ]

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v4
      with:
        repository: metabase/metabase
        ref: ${{ matrix.metabase-ref }}
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v4
      with:
        path: metabase/modules/drivers/arrow-flight-sql

    - name: Register arrow-flight-sql as the only driver module
      working-directory: ./metabase
      # Overwriting with a single-entry map (the pattern the ClickHouse driver
      # used) is robust across Metabase versions: building one driver does not
      # need the in-tree driver modules registered, and upstream reshuffles of
      # modules/drivers (sqlite moved to core, druid removed, ...) can no
      # longer break us.
      run: |
        echo '{:deps {metabase/arrow-flight-sql {:local/root "arrow-flight-sql"}}}' > modules/drivers/deps.edn
        cat modules/drivers/deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Yarn 1.x
      run: |
        npm install -g yarn@1
        yarn --version

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: latest
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-driver-${{ matrix.metabase-ref }}-${{ hashFiles('metabase/modules/drivers/arrow-flight-sql/deps.edn', 'metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-driver-${{ matrix.metabase-ref }}-

    - name: Build driver
      working-directory: ./metabase
      run: |
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh arrow-flight-sql

    - name: Rename jar per Metabase line
      run: |
        MB_LINE=$(echo "${{ matrix.metabase-ref }}" | sed -E 's/^v0\.([0-9]+).*/mb\1/')
        mkdir -p out
        cp metabase/resources/modules/arrow-flight-sql.metabase-driver.jar \
           "out/arrow-flight-sql.metabase-driver-${MB_LINE}.jar"
        ls -la out/

    - name: Upload driver artifact
      uses: actions/upload-artifact@v4
      with:
        name: metabase-arrow-flight-sql-driver-${{ matrix.metabase-ref }}
        path: out/*.jar
        if-no-files-found: error

  # Runs Metabase's own driver test harness (test extensions under test/)
  # against a GizmoSQL service, scoped to the driver's test namespace (which
  # loads the shared test-data dataset through the harness: DDL + INSERT over
  # Flight SQL, validated sync, MBQL known-answer queries) plus the pure unit
  # tests for the connection spec builder.
  driver-test-suite:
    runs-on: ubuntu-latest
    services:
      gizmosql:
        image: gizmodata/gizmosql:v1.35.1
        env:
          TLS_ENABLED: "0"
          GIZMOSQL_USERNAME: gizmosql
          GIZMOSQL_PASSWORD: gizmosql_password
          SECRET_KEY: ci-test-jwt-signing-key-0123456789abcdef
          PRINT_QUERIES: "0"
        ports:
          - 31337:31337

    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v4
      with:
        repository: metabase/metabase
        ref: v0.62.5
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v4
      with:
        path: metabase/modules/drivers/arrow-flight-sql

    - name: Register driver module and test path
      working-directory: ./metabase
      run: |
        echo '{:deps {metabase/arrow-flight-sql {:local/root "arrow-flight-sql"}}}' > modules/drivers/deps.edn
        # insert our test dir into the :drivers-dev :extra-paths vector
        sed -i 's|"modules/drivers/athena/test"|"modules/drivers/arrow-flight-sql/test"\n    "modules/drivers/athena/test"|' deps.edn
        grep -n "arrow-flight-sql/test" deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: latest
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-driver-tests-v0.62.5-${{ hashFiles('metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-driver-tests-v0.62.5-

    - name: Run driver test namespace via the shared harness
      working-directory: ./metabase
      env:
        DRIVERS: arrow-flight-sql
        MB_ARROW_FLIGHT_SQL_TEST_HOST: localhost
        MB_ARROW_FLIGHT_SQL_TEST_PORT: "31337"
        MB_ARROW_FLIGHT_SQL_TEST_USER: gizmosql
        MB_ARROW_FLIGHT_SQL_TEST_PASSWORD: gizmosql_password
      run: |
        clojure -X:dev:drivers:drivers-dev:test :only '[metabase.driver.arrow-flight-sql-test]'

  # Releases are created by release-please (merge its release PR on main);
  # this job then attaches the per-Metabase-line jars to that release.
  attach-release-assets:
    runs-on: ubuntu-latest
    needs: [ lint, build ]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: metabase-arrow-flight-sql-driver-*
        merge-multiple: true
        path: ./artifacts/

    - name: Attach jars to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ls -la ./artifacts/
        gh release upload "${{ github.event.release.tag_name }}" \
          ./artifacts/*.jar --clobber --repo "${{ github.repository }}"
