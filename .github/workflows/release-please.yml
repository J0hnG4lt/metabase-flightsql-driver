name: release-please

# Automates releases from Conventional Commits on main:
# 1. Maintains a running "release PR" that accumulates changelog entries and
#    the next semver (feat -> minor, fix -> patch, feat!/BREAKING CHANGE -> major).
# 2. Merging that PR creates the git tag + GitHub release with the changelog.
# 3. When (and only when) a release is created, the build-and-attach job below
#    builds the single driver jar and uploads it to that release.
#
# NOTE: the build+attach MUST live in this workflow, not react to a
# `release: published` event in build.yaml. GitHub does not trigger workflows
# from events raised by the default GITHUB_TOKEN (which release-please uses),
# so a separate release-triggered workflow would never run.
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

# The Metabase version the released jar is built against (keep in sync with
# build.yaml). One jar per release — see README "Compatibility".
env:
  MB_BUILD_REF: v0.63.1.6

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-attach:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Clone Metabase repository
      uses: actions/checkout@v4
      with:
        repository: metabase/metabase
        ref: ${{ env.MB_BUILD_REF }}
        path: metabase

    - name: Checkout driver code
      uses: actions/checkout@v4
      with:
        path: metabase/modules/drivers/arrow-flight-sql

    - name: Register arrow-flight-sql as the only driver module
      working-directory: ./metabase
      run: |
        echo '{:deps {metabase/arrow-flight-sql {:local/root "arrow-flight-sql"}}}' > modules/drivers/deps.edn

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Yarn 1.x
      run: npm install -g yarn@1

    - name: Set up Clojure
      uses: DeLaGuardo/setup-clojure@12.3
      with:
        cli: 1.12.0.1479
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven + gitlibs
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-release-${{ env.MB_BUILD_REF }}-${{ hashFiles('metabase/modules/drivers/arrow-flight-sql/deps.edn', 'metabase/deps.edn') }}
        restore-keys: |
          ${{ runner.os }}-release-${{ env.MB_BUILD_REF }}-

    - name: Build driver
      working-directory: ./metabase
      run: |
        chmod +x ./bin/build-driver.sh
        ./bin/build-driver.sh arrow-flight-sql

    - name: Attach the jar to the release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp metabase/resources/modules/arrow-flight-sql.metabase-driver.jar .
        ls -la ./arrow-flight-sql.metabase-driver.jar
        gh release upload "${{ needs.release-please.outputs.tag_name }}" \
          ./arrow-flight-sql.metabase-driver.jar --clobber --repo "${{ github.repository }}"
