info:
  name: Metabase Arrow Flight SQL Driver
  version: 1.0.0-SNAPSHOT-1.0.0
  description: Allows Metabase to connect to databases via the Apache Arrow Flight SQL JDBC driver.

# contact-info belongs at the top level (not inside driver)
contact-info:
  name: Metabase FlightSQL Driver
  address: https://github.com/J0hnG4lt/metabase-flightsql-driver/issues

driver:
  name: arrow-flight-sql
  display-name: Arrow Flight SQL
  lazy-load: true
  parent: sql-jdbc

  connection-properties:
    # Use built-in host; override placeholder if you want
    - merge:
        - host
        - { placeholder: "localhost" }

    # Use built-in port; override placeholder
    - merge:
        - port
        - { placeholder: "443" }

    # ------------------------------------------------------------------
    # Authentication. One dropdown selects the mode; fields below are
    # shown conditionally (visible-if), following the same pattern the
    # built-in Databricks (use-m2m) and Snowflake (use-password) drivers use.
    #
    # Mode -> JDBC mapping (see connection-details->spec):
    #   user-password -> user=...&password=...   (Flight handshake basic auth;
    #                    for Spice.ai API keys leave Username empty and put
    #                    the key in Password)
    #   token         -> authorization=Bearer <token>  (InfluxDB 3 tokens,
    #                    Dremio PATs, any pre-issued bearer token)
    #   jwt           -> user=token&password=<JWT>     (GizmoSQL external JWT)
    #   none          -> anonymous (ROAPI, kamu, default Spice.ai, Ballista)
    - name: auth-method
      display-name: Authentication method
      type: select
      options:
        - name: Username and password
          value: user-password
        - name: Bearer token / PAT / API key
          value: token
        - name: External JWT (GizmoSQL-style)
          value: jwt
        - name: None (anonymous)
          value: none
      default: user-password

    - name: username
      display-name: Username
      required: false
      visible-if:
        auth-method: user-password

    - merge:
        - password
        - display-name: Password
          required: false
          visible-if:
            auth-method: user-password

    # Secret-typed fields are stored as <name>-value / <name>-id in details
    # and resolved in the driver via driver-api/secret-value-as-string.
    - name: token
      display-name: Bearer token
      type: secret
      secret-kind: password
      required: false
      visible-if:
        auth-method: token

    - name: jwt
      display-name: JWT
      type: secret
      secret-kind: password
      required: false
      visible-if:
        auth-method: jwt

    - name: catalog
      display-name: Catalog (optional)
      type: string
      required: false

    # Standard include/exclude schema patterns (comma-separated, * wildcards);
    # honored during table discovery in describe-database.
    - name: schema-filters
      type: schema-filters
      display-name: Schemas

    # Secure by default, matching both the Arrow Flight SQL JDBC driver's own
    # defaults and the :or defaults in connection-details->spec. Local demo
    # servers without TLS need Use Encryption switched off explicitly.
    - name: useEncryption
      display-name: Use Encryption
      type: boolean
      default: true

    - name: disableCertificateVerification
      display-name: Disable Certificate Verification
      type: boolean
      default: false

    # Advanced section helpers are literal strings
    - advanced-options-start

    # mTLS / custom CA. Stored as secrets; materialized to files and passed
    # to the JDBC driver as tlsRootCerts / clientCertificate / clientKey.
    - name: tls-root-certs
      display-name: Server CA certificate (PEM)
      type: secret
      secret-kind: pem-cert
      required: false

    - name: client-cert
      display-name: mTLS client certificate (PEM)
      type: secret
      secret-kind: pem-cert
      required: false

    - name: client-key
      display-name: mTLS client key (PEM)
      type: secret
      secret-kind: pem-cert
      required: false

    - name: connect-timeout-millis
      display-name: Connect timeout (ms)
      type: integer
      required: false

    # Free-form URL parameters appended to the JDBC URL. Doubles as the
    # escape hatch for oauth.* properties (OAuth2 client_credentials /
    # token_exchange, Arrow JDBC >= 19.0.0), retainCookies/retainAuth, and
    # custom gRPC headers (any unknown parameter is forwarded as a header,
    # e.g. database=<db> for InfluxDB 3).
    - merge:
        - additional-options
        - { placeholder: "threadPoolSize=1&retainAuth=true" }
    - default-advanced-options

init:
  - step: load-namespace
    namespace: metabase.driver.arrow-flight-sql
  - step: register-jdbc-driver
    class: org.apache.arrow.driver.jdbc.ArrowFlightJdbcDriver
